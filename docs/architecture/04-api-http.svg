<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-label="API tra app iPhone e backend">
  <title>API tra app iPhone e backend</title>
  <desc>Trasporto: HTTPS + JSON. Bearer opaco sulle route atleta. Registrazione/login e /health non richiedono una sessione.</desc>
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526071" />
    </marker>
  </defs>
  <text x="60" y="47" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500">API tra app iPhone e backend</text>
  <text x="60" y="76" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Trasporto: HTTPS + JSON. Bearer opaco sulle route atleta. Registrazione/login e /health non richiedono una sessione.</text>
  <rect x="60" y="130" width="600" height="175" rx="10" fill="#eff8f7" stroke="#497d76" stroke-width="1.2" stroke-dasharray="none" />
  <text x="76" y="180" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Autenticazione</text>
  <text x="76" y="204" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">POST /v1/auth/register · email/password/timezone</text>
  <text x="76" y="225" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">POST /v1/auth/login → access_token + expires_at</text>
  <text x="76" y="246" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">POST /v1/auth/logout · revoca sessione corrente</text>
  <text x="76" y="267" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Signup chiuso di default; rate limit nel DB</text>
  <rect x="740" y="130" width="600" height="175" rx="10" fill="#eff8f7" stroke="#497d76" stroke-width="1.2" stroke-dasharray="none" />
  <text x="756" y="180" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Programma</text>
  <text x="756" y="204" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">GET /v1/plan → {version, plan}</text>
  <text x="756" y="225" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">PUT /v1/plan · {expected_version, plan}</text>
  <text x="756" y="246" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">GET /v1/plan/history</text>
  <text x="756" y="267" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Plan → Workout → Step; scritture concorrenti: 409</text>
  <rect x="60" y="405" width="600" height="195" rx="10" fill="#eff8f7" stroke="#497d76" stroke-width="1.2" stroke-dasharray="none" />
  <text x="76" y="455" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Attività e provenienza</text>
  <text x="76" y="479" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">GET /v1/activities?limit=&amp;offset=</text>
  <text x="76" y="500" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">POST /v1/activities/import · 1–500 ActivityRecord</text>
  <text x="76" y="521" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">DELETE /v1/activities/{provider}/{provider_id}</text>
  <text x="76" y="542" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">SI, timestamp con offset, source/id, client_import</text>
  <text x="76" y="563" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Dedup conservativa; il body non sceglie l'atleta</text>
  <rect x="740" y="405" width="600" height="195" rx="10" fill="#eff8f7" stroke="#497d76" stroke-width="1.2" stroke-dasharray="none" />
  <text x="756" y="455" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Review e adattamento</text>
  <text x="756" y="479" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">GET /v1/review/workout → review/advice/program</text>
  <text x="756" y="500" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">POST /v1/review/adjustments/preview</text>
  <text x="756" y="521" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">POST /v1/review/adjustments/{proposal_id}/apply</text>
  <text x="756" y="542" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Apply: {expected_version, confirmed:true}</text>
  <text x="756" y="563" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">La conferma riguarda una proposta salvata dal server</text>
  <rect x="60" y="700" width="600" height="195" rx="10" fill="#eff8f7" stroke="#497d76" stroke-width="1.2" stroke-dasharray="none" />
  <text x="76" y="750" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Account, dati e capacità</text>
  <text x="76" y="774" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">GET /v1/me · identità account</text>
  <text x="76" y="795" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">GET /v1/me/export · export dei propri dati</text>
  <text x="76" y="816" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">DELETE /v1/me · {password, confirmed:true}</text>
  <text x="76" y="837" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">GET /v1/integrations · capacità effettive</text>
  <text x="76" y="858" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">GET /v1/openapi.json · schema autenticato</text>
  <rect x="740" y="700" width="600" height="195" rx="10" fill="#f3effb" stroke="#8063aa" stroke-width="1.2" stroke-dasharray="none" />
  <text x="756" y="750" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Isolamento del contratto</text>
  <text x="756" y="774" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">GET /health · readiness pubblica</text>
  <text x="756" y="795" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">401: sessione; 403: signup/origin; 409: conflitto</text>
  <text x="756" y="816" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">422: body invalido; 429: limite; 503: DB indisponibile</text>
  <text x="756" y="837" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Request DTO Pydantic; response dict Python</text>
  <text x="756" y="858" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">DTO Swift + fixture; response_model da aggiungere</text>
  <rect x="60" y="950" width="1280" height="90" rx="10" fill="#f6f7f9" stroke="#9da7b4" stroke-width="1.2" stroke-dasharray="none" />
  <text x="76" y="979" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">API della UI personale: sistema distinto</text>
  <text x="76" y="1003" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">/api/review/* · /api/plan/{test,sync} · /api/activities/* · /api/calendar/cleanup/*</text>
  <text x="76" y="1024" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Chiamano Coach, usano storage personale e conferme locali; non sono /v1 e non sono un'API pubblica autenticata.</text>
</svg>