<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1090" viewBox="0 0 1260 1090" role="img" aria-label="Sistema attuale: due percorsi separati">
  <title>Sistema attuale: due percorsi separati</title>
  <desc>Frecce = chiamate; verde/blu/viola = codice presente; tratteggio = parte futura. Nessun hosting pubblico.</desc>
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526071" />
    </marker>
  </defs>
  <text x="60" y="47" fill="#17212f" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500">Sistema attuale: due percorsi separati</text>
  <text x="60" y="76" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Frecce = chiamate; verde/blu/viola = codice presente; tratteggio = parte futura. Nessun hosting pubblico.</text>
